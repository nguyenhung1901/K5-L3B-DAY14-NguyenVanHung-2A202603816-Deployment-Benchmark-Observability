# Railway: set Root Directory to 06-lab-complete when connecting the monorepo.
# Set AGENT_API_KEY and REDIS_URL in Railway variables (never hard-code secrets).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
